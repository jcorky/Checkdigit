<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workspace — Checkdigit</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23172229'/%3E%3Crect x='6.5' y='9.5' width='19' height='13' rx='2' fill='none' stroke='%23BCE962' stroke-width='2'/%3E%3Crect x='18.5' y='9.5' width='7' height='13' rx='2' fill='%23BCE962' fill-opacity='0.25' stroke='%23BCE962' stroke-width='2'/%3E%3C/svg%3E">
<script type="module" src="./index.ts"></script>
</head>
<body>

<header class="bar">
  <div class="wrap row">
    <a class="brand" href="/workspace/">
      <svg class="glyph" viewBox="0 0 28 20" aria-hidden="true">
        <rect x="1" y="1" width="26" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="2"/>
        <rect x="19" y="1" width="8" height="18" rx="3" fill="currentColor" fill-opacity="0.25" stroke="currentColor" stroke-width="2"/>
      </svg>
      Checkdigit workspace
    </a>
    <nav aria-label="Workspace">
      <a class="navlink" href="/workspace/" aria-current="page">Jobs</a>
      <a class="navlink" href="/workspace/profiles">Profiles &amp; feedback</a>
      <a class="navlink" href="/workspace/connections">Connections</a>
      <a class="navlink" href="/">Public site</a>
    </nav>
  </div>
</header>

<main class="page app">
  <div class="wrap">
    <div class="ws-bar">
      <div>
        <p class="eyebrow">Private workspace</p>
        <h1>Jobs</h1>
      </div>
      <div id="ws-switch"></div>
    </div>
    <div class="stripes" aria-hidden="true" style="margin-bottom:12px"></div>
    <div id="msg"></div>
    <div id="summary" class="tiles"></div>

    <section class="panel step" aria-labelledby="s1">
      <h2 class="step-title" id="s1"><span class="section-no">1</span> Register a file and declare the intent</h2>
      <form id="submit-form" class="form-grid">
        <label>File <input id="file" type="file" required></label>
        <label>Profile <select id="profile"><option value="">none (declare columns below)</option></select></label>
        <label>Import mode
          <select id="mode">
            <option value="comparison_only">comparison only</option>
            <option value="incremental">incremental</option>
            <option value="full_snapshot">full snapshot</option>
            <option value="explicit_removal">explicit removal</option>
          </select>
        </label>
        <label>Scope kind
          <select id="scope-kind">
            <option value="source_fleet">source fleet</option>
            <option value="terminal">terminal</option>
            <option value="location">location</option>
            <option value="voyage">voyage</option>
            <option value="profile_population">profile population</option>
          </select>
        </label>
        <label>Scope value <input id="scope-value" type="text" value="all"></label>
        <label>Declared record count <input id="declared" type="number" min="0" placeholder="optional"></label>
        <label>Identifier columns (CSV, comma separated) <input id="columns" type="text" placeholder="container"></label>
        <label>Attribute columns (CSV, optional) <input id="attr-columns" type="text" placeholder="size,owner"></label>
        <label>Owner policy <select id="owner-policy"><option value="strict">strict</option><option value="lenient">lenient</option></select></label>
        <label class="inline-label"><input id="run-inline" type="checkbox" checked> run now in this request</label>
      </form>
      <div class="progress" aria-hidden="true"><div id="progress"></div></div>
      <div class="row-actions">
        <button id="submit" class="btn btn-primary" type="button">Register and analyse</button>
        <span id="submit-status" class="small"></span>
      </div>
    </section>

    <section class="panel step" aria-labelledby="s2">
      <h2 class="step-title" id="s2"><span class="section-no blue">2</span> Jobs</h2>
      <div id="jobs"></div>
      <div class="row-actions"><button id="more-jobs" class="btn btn-ghost btn-small" type="button" hidden>Load more</button></div>
    </section>

    <section class="panel step" aria-labelledby="s3">
      <h2 class="step-title" id="s3"><span class="section-no orange">3</span> Generations and fleet</h2>
      <div id="generations"></div>
      <div id="fleet" class="small"></div>
    </section>

    <section class="panel step" aria-labelledby="s4">
      <h2 class="step-title" id="s4"><span class="section-no">4</span> Storage and retention</h2>
      <div id="usage"></div>
      <div class="row-actions">
        <button id="purge" class="btn btn-ghost btn-small" type="button">Apply retention (purge)</button>
        <span id="purge-status" class="small"></span>
      </div>
    </section>
  </div>
</main>
</body>
</html>
